        function handlePKChange(idx, checked) {
            if (checked) {
                columns.forEach((col, i) => {
                    col.is_pk = (i === idx);
                });
                columns[idx].nullable = false;
            } else {
                columns[idx].is_pk = false;
            }
            
            renderColumns();
        }

        function toggleExpand(idx) {
            if (expandedColumns.has(idx)) {
                expandedColumns.delete(idx);
            } else {
                expandedColumns.add(idx);
            }
            renderColumns();
        }

        function updateColumn(idx, field, value) {
            // PK 컬럼은 nullable을 true로 변경할 수 없음
            if (field === 'nullable' && columns[idx].is_pk && value === true) {
                alert('Primary Key columns cannot be nullable');
                renderColumns();
                return;
            }
            
            const column = columns[idx];
            
            // 값 업데이트
            column[field] = value;
            
            if (field === 'default_checked') {
                column.default_value = value ? '1' : '0';
            }
            
            if (field === 'number_type') {
                if (value === 'integer') {
                    column.type = 'INT';
                    delete column.decimal_places;
                } else if (value === 'decimal') {
                    column.type = 'DECIMAL';
                    column.decimal_places = column.decimal_places || 2;
                } else if (value === 'float') {
                    column.type = 'DOUBLE';
                    delete column.decimal_places;
                }
            }
            
            if (field === 'fk_table') {
                column.fk_column = '';
            }
            
            renderColumns();
        }
        
        // 컬럼 편집 시작 (편집 모드 전용)
        function editColumn(idx) {
            editingColumn = idx;
            renderColumns();
        }
        
        // 컬럼 편집 저장 (편집 모드 전용)
        function saveColumnEdit(idx) {
            const column = columns[idx];
            const tableName = document.getElementById('tableName').value.trim();
            const isNewColumn = column._isNew || false;
            
            let operation, sql, message;
            
            if (isNewColumn) {
                // 새 컬럼 추가
                operation = 'alter_table_add_column';
                sql = `ALTER TABLE ${tableName} ADD COLUMN ${column.name} ${column.type}`;
                message = '추가';
            } else {
                // 기존 컬럼 수정
                operation = 'alter_table_modify_column';
                sql = `ALTER TABLE ${tableName} MODIFY COLUMN ${column.name} ${column.type}`;
                message = '수정';
            }
            
            // 공통 SQL 속성
            if (column.length) sql += `(${column.length})`;
            if (!column.nullable) sql += ' NOT NULL';
            if (column.auto_increment) sql += ' AUTO_INCREMENT';
            if (column.unique) sql += ' UNIQUE';
            if (column.default_value) {
                if (column.default_value.includes('CURRENT_TIMESTAMP')) {
                    sql += ` DEFAULT ${column.default_value}`;
                } else {
                    sql += ` DEFAULT '${column.default_value}'`;
                }
            }
            sql += ';';
            
            const payload = {
                operation: operation,
                database: 'nexacro_db',
                table_name: tableName,
                column: column
            };
            
            console.log(`${operation.toUpperCase()}:`, JSON.stringify(payload, null, 2));
            
            if (confirm(`컬럼 "${column.name}"을 ${message}하시겠습니까?\n\n${sql}`)) {
                if (isNewColumn) {
                    // 새 컬럼은 _isNew 플래그 제거하고 원본에 추가
                    delete column._isNew;
                    originalColumns.push(JSON.parse(JSON.stringify(column)));
                } else {
                    // 기존 컬럼은 원본 업데이트
                    const originalIdx = originalColumns.findIndex(c => c.id === column.id);
                    if (originalIdx >= 0) {
                        originalColumns[originalIdx] = JSON.parse(JSON.stringify(column));
                    }
                }
                
                editingColumn = null;
                alert(`✅ 컬럼이 ${message}되었습니다.`);
                renderColumns();
            }
        }
        
        // 컬럼 편집 취소 (편집 모드 전용)
        function cancelColumnEdit(idx) {
            const column = columns[idx];
            
            if (column._isNew) {
                // 새 컬럼은 아예 삭제
                columns.splice(idx, 1);
            } else {
                // 원본으로 되돌리기
                const originalColumn = originalColumns.find(c => c.id === column.id);
                if (originalColumn) {
                    Object.assign(column, JSON.parse(JSON.stringify(originalColumn)));
                }
            }
            
            editingColumn = null;
            renderColumns();
        }
        
        // 컬럼 변경 여부 확인 헬퍼 함수 (더 이상 사용 안함)
        function isColumnModified(current, original) {
            const fields = ['name', 'type', 'length', 'nullable', 'unique', 'default_value', 
                           'auto_increment', 'default_mode', 'is_pk', 'comment', 'unsigned',
                           'on_update_timestamp', 'fk_table', 'fk_column', 'on_delete', 'on_update'];
            
            for (const field of fields) {
                if (current[field] !== original[field]) {
                    return true;
                }
            }
            
            return false;
        }

        function changePreset(idx, presetKey) {
            const preset = PRESETS[presetKey];
            const currentName = columns[idx].name;
            const currentId = columns[idx].id;
            const currentIsPK = columns[idx].is_pk;
            
            columns[idx] = {
                id: currentId,
                name: currentName,
                preset: presetKey,
                ...JSON.parse(JSON.stringify(preset.defaults))
            };
            
            // auto_increment_id 프리셋 선택 시에만 자동으로 PK 설정
            if (presetKey === 'auto_increment_id') {
                columns.forEach((col, i) => {
                    col.is_pk = (i === idx);
                });
                columns[idx].nullable = false;
            } else {
                // 다른 프리셋으로 변경 시 기존 PK 상태 유지
                columns[idx].is_pk = currentIsPK;
                if (currentIsPK) {
                    columns[idx].nullable = false;
                }
            }
            
            renderColumns();
        }

        function addColumn() {
            const newId = Math.max(...columns.map(c => c.id), 0) + 1;
            const newColumn = {
                id: newId,
                name: 'new_column',
                preset: 'text',
                ...JSON.parse(JSON.stringify(PRESETS.text.defaults))
            };
            
            if (isEditMode) {
                // 편집 모드: 새 컬럼 플래그 추가하고 자동으로 편집 모드 진입
                newColumn._isNew = true;
                columns.push(newColumn);
                editingColumn = columns.length - 1;
            } else {
                // 신규 모드: 로컬에만 추가 (나중에 CREATE TABLE 시 일괄 생성)
                columns.push(newColumn);
            }
            
            renderColumns();
        }

        function deleteColumn(idx) {
            const column = columns[idx];
            
            if (!confirm(`컬럼 "${column.name}"을 삭제하시겠습니까?`)) {
                return;
            }
            
            if (isEditMode) {
                // 편집 모드: 즉시 ALTER TABLE DROP COLUMN 실행
                const tableName = document.getElementById('tableName').value.trim();
                
                const payload = {
                    operation: 'alter_table_drop_column',
                    database: 'nexacro_db',
                    table_name: tableName,
                    column_name: column.name
                };
                
                console.log('ALTER TABLE DROP COLUMN:', JSON.stringify(payload, null, 2));
                
                // 서버 응답 시뮬레이션
                alert(`✅ 컬럼 "${column.name}"이 삭제되었습니다.\n\nALTER TABLE ${tableName} DROP COLUMN ${column.name};`);
                
                columns.splice(idx, 1);
                // 원본에서도 제거
                const originalIdx = originalColumns.findIndex(c => c.id === column.id);
                if (originalIdx >= 0) {
                    originalColumns.splice(originalIdx, 1);
                }
            } else {
                // 신규 모드: 바로 삭제
                columns.splice(idx, 1);
            }
            
            expandedColumns.delete(idx);
            renderColumns();
        }
        
        // 복원 함수는 더 이상 필요 없음 (즉시 삭제하므로)
        function restoreColumn(idx) {
            // 편집 모드에서는 사용하지 않음
        }

        // ============ DATA TAB FUNCTIONS ============

        function renderDataGrid() {
            const container = document.getElementById('dataGridContainer');
            const filterSelect = document.getElementById('filterColumn');
            
            // Update filter column options
            filterSelect.innerHTML = '<option value="">All columns</option>' +
                columns.map(col => `<option value="${col.name}">${col.name}</option>`).join('');
            
            // Update row count
            document.getElementById('rowCount').textContent = `${filteredData.length} rows`;
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">No data found</div>
                        <div class="empty-state-subtext">Add a new row to get started</div>
                    </div>
                `;
                return;
            }
            
            let html = '<table class="data-grid"><thead><tr>';
            
            // Render headers with sort buttons
            columns.forEach(col => {
                const isSorted = sortColumn === col.name;
                const sortIcon = isSorted ? (sortDirection === 'asc' ? '↑' : '↓') : '⇅';
                html += `
                    <th>
                        <div class="header-content">
                            <div class="column-name">
                                ${col.is_pk ? '🔑 ' : ''}${col.name}
                            </div>
                            <button class="sort-btn ${isSorted ? 'active' : ''}" 
                                    onclick="sortData('${col.name}')"
                                    title="Sort by ${col.name}">
                                ${sortIcon}
                            </button>
                        </div>
                    </th>
                `;
            });
            
            html += '<th>Actions</th></tr></thead><tbody>';
            
            // Render data rows
            filteredData.forEach((row, idx) => {
                const isEditing = editingRow === idx;
                html += `<tr class="${isEditing ? 'editing' : ''}">`;
                
                columns.forEach(col => {
                    const value = row[col.name] ?? '';
                    if (isEditing) {
                        html += `<td><input type="text" value="${value}" id="edit_${col.name}"></td>`;
                    } else {
                        html += `<td title="${value}">${value}</td>`;
                    }
                });
                
                html += `<td class="actions-cell">`;
                if (isEditing) {
                    html += `
                        <button onclick="saveRow(${idx})" class="primary">Save</button>
                        <button onclick="cancelEdit()">Cancel</button>
                    `;
                } else {
                    html += `
                        <button onclick="editRow(${idx})">Edit</button>
                        <button onclick="deleteRow(${idx})" class="danger">Delete</button>
                    `;
                }
                html += `</td></tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function sortData(columnName) {
            if (sortColumn === columnName) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = columnName;
                sortDirection = 'asc';
            }
            
            filteredData.sort((a, b) => {
                let aVal = a[columnName];
                let bVal = b[columnName];
                
                // Handle null/undefined
                if (aVal == null) return 1;
                if (bVal == null) return -1;
                
                // String comparison
                if (typeof aVal === 'string' && typeof bVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }
                
                if (sortDirection === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });
            
            renderDataGrid();
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filterColumn = document.getElementById('filterColumn').value;
            
            filteredData = tableData.filter(row => {
                if (!searchTerm) return true;
                
                if (filterColumn) {
                    const value = String(row[filterColumn] || '').toLowerCase();
                    return value.includes(searchTerm);
                } else {
                    return Object.values(row).some(val => 
                        String(val || '').toLowerCase().includes(searchTerm)
                    );
                }
            });
            
            renderDataGrid();
        }

        function addRow() {
            editingRow = null;
            const newRow = {};
            columns.forEach(col => {
                if (col.auto_increment) {
                    newRow[col.name] = Math.max(...tableData.map(r => r[col.name] || 0), 0) + 1;
                } else if (col.default_value && col.default_mode === 'default_value') {
                    newRow[col.name] = col.default_value;
                } else {
                    newRow[col.name] = '';
                }
            });
            tableData.unshift(newRow);
            filteredData = [...tableData];
            editingRow = 0;
            renderDataGrid();
        }

        function editRow(idx) {
            editingRow = idx;
            renderDataGrid();
        }

        function saveRow(idx) {
            const row = filteredData[idx];
            columns.forEach(col => {
                const input = document.getElementById(`edit_${col.name}`);
                if (input) {
                    row[col.name] = input.value;
                }
            });
            editingRow = null;
            renderDataGrid();
            console.log('Saved row:', row);
        }

        function cancelEdit() {
            if (editingRow === 0 && !filteredData[0].id) {
                // Cancel new row creation
                tableData.shift();
                filteredData = [...tableData];
            }
            editingRow = null;
            renderDataGrid();
        }

        function deleteRow(idx) {
            const row = filteredData[idx];
            if (confirm(`Delete this row?`)) {
                const dataIdx = tableData.indexOf(row);
                tableData.splice(dataIdx, 1);
                filteredData = [...tableData];
                renderDataGrid();
            }
        }

        function refreshData() {
            console.log('Refreshing data...');
            filteredData = [...tableData];
            editingRow = null;
            renderDataGrid();
        }

        // ============ COMMON FUNCTIONS ============

        function updateTableDescription(value) {
            tableDescription = value;
        }

        function saveTable() {
            const tableName = document.getElementById('tableName').value.trim();
            
            if (isEditMode) {
                // 편집 모드에서는 모든 작업이 즉시 실행되므로 Save Table 버튼이 필요 없음
                alert('편집 모드에서는 각 작업(ADD/MODIFY/DELETE)이 즉시 실행됩니다.\n\n변경된 컬럼의 "💾 Save" 버튼을 눌러 수정사항을 저장하세요.');
                return;
            }
            
            // 신규 테이블 생성 모드
            const payload = {
                operation: 'create_table',
                database: 'nexacro_db',
                table_name: tableName,
                description: tableDescription,
                columns: columns,
                data: tableData
            };
            
            console.log('Creating table:', JSON.stringify(payload, null, 2));
            
            // SQL 미리보기 생성
            let sql = `CREATE TABLE ${tableName} (\n`;
            const columnDefs = columns.map(col => {
                let def = `  ${col.name} ${col.type}`;
                if (col.length) def += `(${col.length})`;
                if (!col.nullable) def += ' NOT NULL';
                if (col.auto_increment) def += ' AUTO_INCREMENT';
                if (col.unique && !col.is_pk) def += ' UNIQUE';
                if (col.default_value) {
                    if (col.default_value.includes('CURRENT_TIMESTAMP')) {
                        def += ` DEFAULT ${col.default_value}`;
                    } else {
                        def += ` DEFAULT '${col.default_value}'`;
                    }
                }
                return def;
            });
            sql += columnDefs.join(',\n');
            const pkColumn = columns.find(c => c.is_pk);
            if (pkColumn) {
                sql += `,\n  PRIMARY KEY (${pkColumn.name})`;
            }
            sql += '\n);';
            
            if (confirm(`테이블 "${tableName}"을 생성하시겠습니까?\n\n${sql}`)) {
                alert('✅ 테이블이 생성되었습니다!\n\n자세한 내용은 콘솔을 확인하세요.');
            }
        }

        // ============ CSV IMPORT FUNCTIONS ============

        /**
         * CSV 파일 파싱
         */
        function parseCSVFile(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        resolve(results);
                    },
                    error: function(error) {
                        reject(error);
                    }
                });
            });
        }

        /**
         * CSV 파일 업로드 처리
         */
        document.getElementById('csvFileInput').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                // CSV 파싱
                const results = await parseCSVFile(file);
                
                if (!results.data || results.data.length === 0) {
                    alert('CSV 파일에 데이터가 없습니다.');
                    return;
                }
                
                // 컬럼 생성
                const csvColumns = generateColumnsFromCSV(results);
                
                // 기존 컬럼 교체 확인
                if (columns.length > 0) {
                    if (!confirm('기존 컬럼을 CSV 컬럼으로 교체하시겠습니까?')) {
                        // 기존 컬럼 유지하고 CSV 컬럼 추가
                        const maxId = Math.max(...columns.map(c => c.id), 0);
                        csvColumns.forEach((col, idx) => {
                            col.id = maxId + idx + 1;
                        });
                        columns = [...columns, ...csvColumns];
                    } else {
                        // 기존 컬럼 교체
                        columns = csvColumns;
                    }
                } else {
                    columns = csvColumns;
                }
                
                // CSV 데이터를 tableData로 변환
                const csvData = convertCSVDataToTableData(results, csvColumns);
                tableData = csvData;
                filteredData = [...tableData];
                
                // 테이블명 제안
                const suggestedName = file.name.replace('.csv', '').toLowerCase().replace(/[^a-z0-9_]/g, '_');
                if (confirm(`테이블명을 "${suggestedName}"로 변경하시겠습니까?`)) {
                    document.getElementById('tableName').value = suggestedName;
                }
                
                // 컬럼 리스트 렌더링
                renderColumns();
                
                // Data 탭도 렌더링
                renderDataGrid();
                
                alert(`✅ CSV 파일 로드 완료!\n\n${csvColumns.length}개 컬럼, ${tableData.length}개 데이터 행이 추가되었습니다.`);
                
            } catch (error) {
                alert('CSV 파일 처리 실패: ' + error.message);
                console.error(error);
            }
            
            // 파일 입력 초기화
            event.target.value = '';
        });
        
        /**
         * CSV 데이터를 tableData 형식으로 변환
         */
        function convertCSVDataToTableData(parseResults, csvColumns) {
            const originalHeaders = parseResults.meta.fields;
            const csvRows = parseResults.data;
            
            // 원본 헤더와 sanitized 컬럼명 매핑
            const headerMapping = {};
            originalHeaders.forEach((originalHeader, idx) => {
                headerMapping[originalHeader] = csvColumns[idx].name;
            });
            
            // 데이터 변환
            return csvRows.map(row => {
                const newRow = {};
                originalHeaders.forEach(originalHeader => {
                    const columnName = headerMapping[originalHeader];
                    newRow[columnName] = row[originalHeader];
                });
                return newRow;
            });
        }

        /**
         * CSV 데이터로부터 컬럼 정의 생성
         */
        function generateColumnsFromCSV(parseResults) {
            const headers = parseResults.meta.fields;
            const data = parseResults.data;
            
            if (!headers || headers.length === 0) {
                throw new Error('CSV에서 컬럼을 찾을 수 없습니다');
            }
            
            const newColumns = headers.map((header, idx) => {
                // 컬럼의 모든 값 수집
                const columnValues = data.map(row => row[header]);
                
                // 타입 추론
                const inferredType = inferColumnType(columnValues);
                
                return {
                    id: idx + 1,
                    name: sanitizeColumnName(header),
                    preset: 'custom',
                    type: inferredType.type,
                    length: inferredType.length || null,
                    precision: inferredType.precision || null,
                    decimal_places: inferredType.decimal_places || null,
                    values: inferredType.values || null,
                    nullable: true,
                    unique: false,
                    is_pk: false,
                    unsigned: inferredType.unsigned || false,
                    auto_increment: false,
                    default_mode: 'no_default',
                    default_value: null,
                    on_update_timestamp: false,
                    comment: 'From CSV: ' + header,
                    original_name: header
                };
            });
            
            // 첫 번째 컬럼이 'id'이고 정수형이면 PK로 설정
            if (newColumns.length > 0) {
                const firstCol = newColumns[0];
                if (firstCol.name === 'id' && ['TINYINT', 'SMALLINT', 'MEDIUMINT', 'INT', 'BIGINT'].includes(firstCol.type)) {
                    firstCol.is_pk = true;
                    firstCol.nullable = false;
                    firstCol.auto_increment = true;
                }
            }
            
            return newColumns;
        }

        /**
         * 컬럼 타입 추론
         */
        function inferColumnType(values) {
            const nonNullValues = values.filter(v => v !== null && v !== undefined && v !== '');
            
            if (nonNullValues.length === 0) {
                return { type: 'VARCHAR', length: 255 };
            }
            
            // Boolean 체크
            const boolValues = nonNullValues.filter(v => 
                ['true', 'false', '1', '0', 'yes', 'no'].includes(String(v).toLowerCase())
            );
            if (boolValues.length === nonNullValues.length) {
                return { type: 'TINYINT', length: 1 };
            }
            
            // 정수 체크
            const intValues = nonNullValues.filter(v => /^-?\d+$/.test(String(v)));
            if (intValues.length === nonNullValues.length) {
                const nums = intValues.map(v => parseInt(v));
                const min = Math.min(...nums);
                const max = Math.max(...nums);
                
                const unsigned = min >= 0;
                
                if (unsigned) {
                    if (max <= 255) return { type: 'TINYINT', unsigned: true };
                    if (max <= 65535) return { type: 'SMALLINT', unsigned: true };
                    if (max <= 16777215) return { type: 'MEDIUMINT', unsigned: true };
                    if (max <= 4294967295) return { type: 'INT', unsigned: true };
                    return { type: 'BIGINT', unsigned: true };
                } else {
                    if (min >= -128 && max <= 127) return { type: 'TINYINT' };
                    if (min >= -32768 && max <= 32767) return { type: 'SMALLINT' };
                    if (min >= -8388608 && max <= 8388607) return { type: 'MEDIUMINT' };
                    if (min >= -2147483648 && max <= 2147483647) return { type: 'INT' };
                    return { type: 'BIGINT' };
                }
            }
            
            // 소수 체크
            const floatValues = nonNullValues.filter(v => /^-?\d+\.\d+$/.test(String(v)));
            if (floatValues.length === nonNullValues.length) {
                const maxDecimals = Math.max(...floatValues.map(v => {
                    const parts = String(v).split('.');
                    return parts[1] ? parts[1].length : 0;
                }));
                return { 
                    type: 'DECIMAL', 
                    precision: 10 + maxDecimals,
                    decimal_places: maxDecimals
                };
            }
            
            // 날짜 체크
            const dateValues = nonNullValues.filter(v => !isNaN(Date.parse(String(v))));
            if (dateValues.length === nonNullValues.length) {
                const hasTime = dateValues.some(v => String(v).includes(':'));
                return { type: hasTime ? 'DATETIME' : 'DATE' };
            }
            
            // JSON 체크
            const jsonValues = nonNullValues.filter(v => {
                try {
                    JSON.parse(String(v));
                    return true;
                } catch {
                    return false;
                }
            });
            if (jsonValues.length === nonNullValues.length) {
                return { type: 'JSON' };
            }
            
            // 문자열 - 길이에 따라 VARCHAR 또는 TEXT
            const maxLength = Math.max(...nonNullValues.map(v => String(v).length));
            if (maxLength <= 255) {
                return { type: 'VARCHAR', length: Math.min(255, maxLength + 50) };
            } else if (maxLength <= 65535) {
                return { type: 'TEXT' };
            } else {
                return { type: 'MEDIUMTEXT' };
            }
        }

        /**
         * 컬럼명 정제 (MySQL 규칙 준수)
         */
        function sanitizeColumnName(name) {
            return name
                .toLowerCase()
                .replace(/\s+/g, '_')
                .replace(/[^a-z0-9_]/g, '')
                .replace(/^(\d)/, '_$1');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'data') {
                renderDataGrid();
            }
        }

        // ============ IMPORT DATA TO EXISTING TABLE ============

        let importCSVData = null;
        let importCSVHeaders = [];
        let columnMapping = {};

        /**
         * Import Data 모달 열기
         */
        function openImportDataModal() {
            const tableName = document.getElementById('tableName').value.trim();
            
            if (!tableName) {
                alert('테이블명을 먼저 입력해주세요.');
                return;
            }
            
            if (columns.length === 0) {
                alert('컬럼이 없습니다. 먼저 컬럼을 추가하거나 "Import CSV"를 사용하세요.');
                return;
            }
            
            // 모달 초기화
            importCSVData = null;
            importCSVHeaders = [];
            columnMapping = {};
            
            document.getElementById('csvDataInput').value = '';
            document.getElementById('importFileName').textContent = '';
            document.getElementById('columnMappingSection').style.display = 'none';
            document.getElementById('importModeSection').style.display = 'none';
            document.getElementById('importDataBtn').disabled = true;
            
            // 테이블 정보 표시
            document.getElementById('importTableName').textContent = tableName;
            document.getElementById('tableInfoText').innerHTML = `
                <strong>${tableName}</strong> 테이블에 데이터를 import합니다.<br>
                현재 컬럼 수: ${columns.length}개<br>
                컬럼: ${columns.map(c => c.name).join(', ')}
            `;
            
            // 모달 표시
            document.getElementById('importDataModal').style.display = 'block';
        }

        /**
         * Import Data 모달 닫기
         */
        function closeImportDataModal() {
            document.getElementById('importDataModal').style.display = 'none';
        }

        /**
         * CSV 파일 업로드 (Import Data용)
         */
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('csvDataInput').addEventListener('change', async function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                try {
                    // CSV 파싱
                    const results = await parseCSVFile(file);
                    
                    if (!results.data || results.data.length === 0) {
                        alert('CSV 파일에 데이터가 없습니다.');
                        return;
                    }
                    
                    importCSVData = results.data;
                    importCSVHeaders = results.meta.fields;
                    
                    // 파일명 표시
                    document.getElementById('importFileName').textContent = `${file.name} (${importCSVData.length} rows)`;
                    
                    // 컬럼 매핑
                    updateColumnMapping();
                    
                } catch (error) {
                    alert('CSV 파일 파싱 실패: ' + error.message);
                    console.error(error);
                }
            });

            // Import 모드 변경 이벤트
            const radios = document.querySelectorAll('input[name="importMode"]');
            radios.forEach(radio => {
                radio.addEventListener('change', function() {
                    const upsertSection = document.getElementById('upsertKeySection');
                    if (this.value === 'upsert') {
                        upsertSection.style.display = 'block';
                        updateUpsertKeyOptions();
                    } else {
                        upsertSection.style.display = 'none';
                    }
                    updateImportPreview();
                });
            });
        });

        /**
         * 컬럼 매핑 업데이트
         */
        function updateColumnMapping() {
            // 자동 매핑
            columnMapping = autoMapColumns(importCSVHeaders, columns);
            
            // UI 렌더링
            renderColumnMapping();
            
            // Section 표시
            document.getElementById('columnMappingSection').style.display = 'block';
            document.getElementById('importModeSection').style.display = 'block';
            
            // Import 버튼 활성화
            updateImportButton();
        }

        /**
         * 컬럼 자동 매핑
         */
        function autoMapColumns(csvHeaders, tableColumns) {
            const mapping = {};
            
            csvHeaders.forEach(csvCol => {
                // 1순위: 정확히 일치
                let matched = tableColumns.find(tc => 
                    tc.name.toLowerCase() === csvCol.toLowerCase()
                );
                
                // 2순위: 정규화 후 일치 (언더스코어, 공백, 하이픈 무시)
                if (!matched) {
                    const csvNorm = csvCol.toLowerCase().replace(/[_\s-]/g, '');
                    matched = tableColumns.find(tc => 
                        tc.name.toLowerCase().replace(/[_\s-]/g, '') === csvNorm
                    );
                }
                
                // 3순위: 포함 관계
                if (!matched) {
                    matched = tableColumns.find(tc => {
                        const tcName = tc.name.toLowerCase();
                        const csvName = csvCol.toLowerCase();
                        return tcName.includes(csvName) || csvName.includes(tcName);
                    });
                }
                
                mapping[csvCol] = matched ? matched.name : null; // null = Skip
            });
            
            return mapping;
        }

        /**
         * 컬럼 매핑 UI 렌더링
         */
        function renderColumnMapping() {
            const tbody = document.getElementById('mappingBody');
            let html = '';
            
            let matchedCount = 0;
            let skippedCount = 0;
            
            importCSVHeaders.forEach(csvCol => {
                const tableCol = columnMapping[csvCol];
                const status = tableCol ? 'matched' : 'skipped';
                
                if (tableCol) matchedCount++;
                else skippedCount++;
                
                // 미리보기 데이터
                const previewData = importCSVData.slice(0, 3).map(row => row[csvCol]).join(', ');
                const preview = previewData.length > 30 ? previewData.substring(0, 30) + '...' : previewData;
                
                html += `
                    <tr>
                        <td><strong>${csvCol}</strong></td>
                        <td class="mapping-arrow">→</td>
                        <td>
                            <select onchange="updateMapping('${csvCol}', this.value)">
                                <option value="">-- Skip --</option>
                                ${columns.map(tc => `
                                    <option value="${tc.name}" ${tableCol === tc.name ? 'selected' : ''}>
                                        ${tc.name} (${tc.type})
                                    </option>
                                `).join('')}
                            </select>
                        </td>
                        <td>
                            <span class="mapping-status ${status}">
                                ${tableCol ? '✅ Matched' : '⚠️ Skipped'}
                            </span>
                        </td>
                        <td class="mapping-preview">${preview}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            
            // 통계 표시
            document.getElementById('mappingStats').innerHTML = `
                매핑 완료: <strong>${matchedCount}개</strong> / 건너뛰기: <strong>${skippedCount}개</strong> / 총 CSV 컬럼: <strong>${importCSVHeaders.length}개</strong>
            `;
            
            // Preview 업데이트
            updateImportPreview();
        }

        /**
         * 매핑 수동 변경
         */
        function updateMapping(csvCol, tableCol) {
            columnMapping[csvCol] = tableCol || null;
            renderColumnMapping();
            updateImportButton();
        }

        /**
         * Upsert Key 옵션 업데이트
         */
        function updateUpsertKeyOptions() {
            const select = document.getElementById('upsertKeySelect');
            select.innerHTML = '';
            
            const pkColumns = columns.filter(col => col.is_pk);
            
            if (pkColumns.length === 0) {
                select.innerHTML = '<option value="">-- No Primary Key --</option>';
                return;
            }
            
            pkColumns.forEach(col => {
                const option = document.createElement('option');
                option.value = col.name;
                option.textContent = col.name;
                select.appendChild(option);
            });
        }

        /**
         * Import 미리보기 업데이트
         */
        function updateImportPreview() {
            const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'append';
            const mappedCount = Object.values(columnMapping).filter(v => v !== null).length;
            const rowCount = importCSVData ? importCSVData.length : 0;
            
            let previewText = '';
            
            if (mode === 'append') {
                previewText = `📌 <strong>${rowCount}개 행</strong>이 테이블에 추가됩니다. (기존 데이터 유지)`;
            } else if (mode === 'replace') {
                previewText = `⚠️ 기존 데이터가 모두 삭제되고, <strong>${rowCount}개 행</strong>이 새로 삽입됩니다.`;
            } else if (mode === 'upsert') {
                previewText = `🔄 <strong>${rowCount}개 행</strong>이 Upsert됩니다. (중복 키: 업데이트 / 신규: 삽입)`;
            }
            
            previewText += `<br>매핑된 컬럼: <strong>${mappedCount}개</strong>`;
            
            document.getElementById('importPreview').innerHTML = previewText;
        }

        /**
         * Import 버튼 활성화 여부
         */
        function updateImportButton() {
            const hasMapping = Object.values(columnMapping).some(v => v !== null);
            document.getElementById('importDataBtn').disabled = !hasMapping;
        }

        /**
         * Import Data 실행
         */
        function executeImportData() {
            const tableName = document.getElementById('tableName').value.trim();
            const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'append';
            const upsertKey = document.getElementById('upsertKeySelect')?.value || null;
            
            // 매핑된 데이터만 필터링
            const mappedData = importCSVData.map(row => {
                const mapped = {};
                Object.entries(columnMapping).forEach(([csvCol, tableCol]) => {
                    if (tableCol) {
                        mapped[tableCol] = row[csvCol];
                    }
                });
                return mapped;
            });
            
            const rowCount = mappedData.length;
            const modeText = mode === 'append' ? '추가' : mode === 'replace' ? '교체' : 'upsert';
            
            if (!confirm(`${rowCount}개 행을 ${tableName} 테이블에 ${modeText} 모드로 import하시겠습니까?`)) {
                return;
            }
            
            try {
                // tableData에 추가 (Append 모드)
                if (mode === 'append') {
                    tableData = [...tableData, ...mappedData];
                } else if (mode === 'replace') {
                    tableData = mappedData;
                } else if (mode === 'upsert') {
                    // Upsert 로직 (간단 구현)
                    mappedData.forEach(newRow => {
                        const existingIdx = tableData.findIndex(row => row[upsertKey] === newRow[upsertKey]);
                        if (existingIdx >= 0) {
                            tableData[existingIdx] = { ...tableData[existingIdx], ...newRow };
                        } else {
                            tableData.push(newRow);
                        }
                    });
                }
                
                filteredData = [...tableData];
                
                // API 호출 로그 (실제로는 서버에 전송)
                const payload = {
                    operation: 'import_data',
                    database: 'nexacro_db',
                    table_name: tableName,
                    mode: mode,
                    primary_key: upsertKey,
                    column_mapping: columnMapping,
                    data: mappedData,
                    options: {
                        batch_size: 1000
                    }
                };
                
                console.log('Import Data Request:', JSON.stringify(payload, null, 2));
                
                // Data 탭으로 전환하고 데이터 렌더링
                switchTab('data');
                renderDataGrid();
                
                alert(`✅ ${rowCount}개 행이 성공적으로 import되었습니다!`);
                closeImportDataModal();
                
            } catch (error) {
                alert('Import 실패: ' + error.message);
                console.error(error);
            }
        }

        // Initialize
        renderColumns();
    </script>

    <!-- Import Data Modal -->
    <div id="importDataModal" class="import-modal" style="display: none;">
        <div class="import-modal-content">
            <div class="import-modal-header">
                <h2>📥 Import Data to "<span id="importTableName"></span>"</h2>
                <button class="import-close-btn" onclick="closeImportDataModal()">&times;</button>
            </div>
            
            <div class="import-modal-body">
                <!-- 현재 테이블 정보 -->
                <div class="import-info-box">
                    <div id="tableInfoText"></div>
                </div>
                
                <!-- Step 1: Upload CSV -->
                <div class="import-section">
                    <h3>Step 1: Upload CSV File</h3>
                    <div class="import-file-upload">
                        <input type="file" id="csvDataInput" accept=".csv" style="display: none;">
                        <button onclick="document.getElementById('csvDataInput').click()" class="import-upload-btn">
                            📂 Choose CSV File
                        </button>
                        <span id="importFileName" class="import-filename"></span>
                    </div>
                </div>
                
                <!-- Step 2: Column Mapping -->
                <div id="columnMappingSection" class="import-section" style="display: none;">
                    <h3>Step 2: Column Mapping</h3>
                    <div class="mapping-container">
                        <table class="mapping-table">
                            <thead>
                                <tr>
                                    <th>CSV Column</th>
                                    <th></th>
                                    <th>Table Column</th>
                                    <th>Status</th>
                                    <th>Preview</th>
                                </tr>
                            </thead>
                            <tbody id="mappingBody"></tbody>
                        </table>
                    </div>
                    <div id="mappingStats" class="mapping-stats"></div>
                </div>
                
                <!-- Step 3: Import Mode -->
                <div id="importModeSection" class="import-section" style="display: none;">
                    <h3>Step 3: Import Mode</h3>
                    <div class="import-mode-options">
                        <label class="radio-option">
                            <input type="radio" name="importMode" value="append" checked>
                            <div>
                                <strong>Append</strong>
                                <span>기존 데이터 유지하고 새 데이터 추가</span>
                            </div>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="importMode" value="replace">
                            <div>
                                <strong>Replace</strong>
                                <span>기존 데이터 삭제 후 새 데이터로 교체</span>
                            </div>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="importMode" value="upsert">
                            <div>
                                <strong>Upsert</strong>
                                <span>중복 키 업데이트, 없으면 삽입</span>
                            </div>
                        </label>
                    </div>
                    
                    <div id="upsertKeySection" style="display: none; margin-top: 16px;">
                        <label style="font-weight: 600; display: block; margin-bottom: 8px;">Primary Key for Upsert:</label>
                        <select id="upsertKeySelect" style="width: 100%; padding: 8px; border: 1px solid #d0d0d0; border-radius: 4px;"></select>
                    </div>
                    
                    <div id="importPreview" class="import-preview"></div>
                </div>
            </div>
            
            <div class="import-modal-footer">
                <button onclick="closeImportDataModal()" class="import-btn-cancel">Cancel</button>
                <button onclick="executeImportData()" class="import-btn-import" id="importDataBtn" disabled>
                    Import Data
                </button>
            </div>
        </div>
    </div>

</body>
</html>
