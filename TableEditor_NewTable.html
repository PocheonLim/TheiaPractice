<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Table Editor - Enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            color: #1a1a1a;
            background: #fafafa;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 14px 24px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .table-name {
            color: #0066ff;
            font-weight: 600;
            font-size: 24px;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 2px 8px;
            background: transparent;
            transition: all 0.2s;
            font-family: inherit;
            outline: none;
            min-width: 200px;
        }

        .table-name:hover {
            border-bottom-color: #e0e0e0;
            background: #f8f9fa;
        }

        .table-name:focus {
            border-bottom-color: #0066ff;
            background: #f0f7ff;
        }

        .table-description {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            resize: vertical;
            min-height: 36px;
            max-height: 80px;
            font-family: inherit;
        }

        .table-description:focus {
            outline: none;
            border-color: #0066ff;
        }

        .table-description::placeholder {
            color: #999;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            padding-top: 4px;
        }

        /* Buttons */
        button {
            padding: 8px 16px;
            border: 1px solid #d0d0d0;
            background: #fff;
            color: #1a1a1a;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #f5f5f5;
            border-color: #b0b0b0;
        }

        button.primary {
            background: #0066ff;
            color: #fff;
            border-color: #0066ff;
        }

        button.primary:hover {
            background: #0052cc;
            border-color: #0052cc;
        }

        button.secondary {
            background: #f5f5f5;
            font-size: 12px;
            padding: 6px 12px;
        }

        button.danger {
            color: #d32f2f;
            border-color: #d32f2f;
        }

        button.danger:hover {
            background: #ffebee;
        }

        button.link {
            background: none;
            border: none;
            color: #0066ff;
            padding: 4px 8px;
            text-decoration: underline;
            font-size: 12px;
        }

        button.link:hover {
            background: #f0f7ff;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 2px solid #e5e5e5;
            padding: 0 24px;
        }

        .tab {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #1a1a1a;
        }

        .tab.active {
            color: #0066ff;
            border-bottom-color: #0066ff;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Common Content Styles */
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow: hidden;
        }

        .content-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .content-toolbar h2 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Columns Tab */
        .columns-list-container {
            flex: 1;
            overflow: auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        .columns-header {
            display: grid;
            grid-template-columns: 40px 50px 200px 180px 80px 80px 1fr 100px;
            align-items: center;
            padding: 10px 12px;
            gap: 12px;
            background: #f8f9fa;
            border-bottom: 2px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 20;
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-row-wrapper {
            border-bottom: 1px solid #f0f0f0;
        }

        .column-row-wrapper:last-child {
            border-bottom: none;
        }

        .column-row-wrapper:hover {
            background: #fafafa;
        }

        .column-row {
            display: grid;
            grid-template-columns: 40px 50px 200px 180px 80px 80px 1fr 100px;
            align-items: center;
            padding: 10px 12px;
            gap: 12px;
            cursor: pointer;
        }
        
        .column-row.editing {
            background: #fff9e6;
            border-left: 3px solid #f57c00;
        }

        .expand-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .expand-btn:hover {
            color: #0066ff;
        }

        .expand-btn.expanded {
            transform: rotate(90deg);
        }

        .col-icon {
            font-size: 18px;
            text-align: center;
        }

        .col-name input,
        .col-preset select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
        }

        .col-name input {
            font-weight: 500;
        }

        .col-preset select {
            font-size: 12px;
            cursor: pointer;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0066ff;
        }

        .col-pk {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .col-pk input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .col-type {
            color: #666;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .col-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .col-actions button {
            padding: 4px 8px;
            font-size: 11px;
        }

        /* Detail Panel */
        .column-detail {
            padding: 16px 12px;
            background: #f8f9fa;
            border-top: 1px solid #e5e5e5;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .detail-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .detail-field input[type="text"],
        .detail-field input[type="number"],
        .detail-field textarea,
        .detail-field select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
            font-family: inherit;
        }

        .detail-field textarea {
            resize: vertical;
            min-height: 60px;
            max-height: 120px;
        }

        .detail-field input:disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
        }

        .checkbox-field input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-field label {
            font-size: 13px;
            color: #1a1a1a;
            cursor: pointer;
        }

        .help-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #999;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 14px;
            font-size: 10px;
            cursor: help;
        }

        .help-text {
            font-size: 11px;
            color: #666;
            font-style: italic;
        }

        .preset-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .preset-badge.custom {
            background: #fff3e0;
            color: #f57c00;
        }

        /* FK Selector */
        .fk-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fk-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Data Tab Styles */
        .data-grid-container {
            flex: 1;
            overflow: auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            position: relative;
        }

        .data-grid {
            width: 100%;
            border-collapse: collapse;
        }

        .data-grid thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f8f9fa;
        }

        .data-grid th {
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e5e5e5;
            background: #f8f9fa;
        }

        .data-grid th .header-content {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: space-between;
        }

        .data-grid th .column-name {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .data-grid th .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            color: #999;
            font-size: 12px;
            transition: color 0.2s;
        }

        .data-grid th .sort-btn:hover {
            color: #0066ff;
        }

        .data-grid th .sort-btn.active {
            color: #0066ff;
        }

        .data-grid td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-grid tbody tr:hover {
            background: #fafafa;
        }

        .data-grid tbody tr.editing {
            background: #fff9e6;
        }

        .data-grid td input {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
        }

        .data-grid td input:focus {
            outline: none;
            border-color: #0066ff;
        }

        .data-grid .actions-cell {
            white-space: nowrap;
        }

        .data-grid .actions-cell button {
            padding: 4px 8px;
            font-size: 11px;
            margin-right: 4px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            padding: 12px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
        }

        .filter-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-bar input:focus {
            outline: none;
            border-color: #0066ff;
        }

        .filter-bar select {
            padding: 8px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
        }

        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 13px;
        }

        /* Import Data Modal */
        .import-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .import-modal-content {
            position: relative;
            background-color: white;
            margin: 5% auto;
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .import-modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .import-modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: #1a1a1a;
        }

        .import-close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 28px;
            height: 28px;
            line-height: 1;
        }

        .import-close-btn:hover {
            color: #333;
        }

        .import-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .import-info-box {
            padding: 12px 16px;
            background: #f0f7ff;
            border-left: 3px solid #0066ff;
            border-radius: 4px;
            margin-bottom: 24px;
            font-size: 13px;
            line-height: 1.6;
        }

        .import-section {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .import-section:last-child {
            border-bottom: none;
        }

        .import-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }

        .import-file-upload {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .import-upload-btn {
            padding: 10px 20px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .import-upload-btn:hover {
            background: #0052cc;
        }

        .import-filename {
            color: #666;
            font-size: 14px;
        }

        .mapping-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
        }

        .mapping-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .mapping-table thead {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
        }

        .mapping-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e5e5e5;
            font-size: 11px;
            text-transform: uppercase;
        }

        .mapping-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .mapping-table tbody tr:hover {
            background: #f8f9fa;
        }

        .mapping-table select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 13px;
        }

        .mapping-arrow {
            text-align: center;
            color: #999;
        }

        .mapping-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .mapping-status.matched {
            color: #28a745;
            background: #e8f5e9;
        }

        .mapping-status.skipped {
            color: #ffc107;
            background: #fff8e1;
        }

        .mapping-preview {
            color: #666;
            font-size: 12px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .mapping-stats {
            margin-top: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
        }

        .import-mode-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border: 2px solid #e5e5e5;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-option:hover {
            border-color: #0066ff;
            background: #f0f7ff;
        }

        .radio-option input[type="radio"] {
            margin-top: 2px;
        }

        .radio-option input[type="radio"]:checked ~ div {
            color: #0066ff;
        }

        .radio-option div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .radio-option strong {
            font-size: 14px;
        }

        .radio-option span {
            font-size: 12px;
            color: #666;
        }

        .import-preview {
            margin-top: 16px;
            padding: 12px;
            background: #fff8e1;
            border-left: 3px solid #ffc107;
            border-radius: 4px;
            font-size: 13px;
        }

        .import-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .import-btn-cancel,
        .import-btn-import {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .import-btn-cancel {
            background: white;
            color: #333;
            border: 1px solid #d0d0d0;
        }

        .import-btn-cancel:hover {
            background: #f5f5f5;
        }

        .import-btn-import {
            background: #0066ff;
            color: white;
        }

        .import-btn-import:hover {
            background: #0052cc;
        }

        .import-btn-import:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>New Table: <input type="text" class="table-name" id="tableName" value="" placeholder="new_table" maxlength="64"></h1>
                <textarea 
                    class="table-description" 
                    placeholder="Add table description..."
                    id="tableDescription"
                    oninput="updateTableDescription(this.value)"></textarea>
            </div>
            <div class="header-actions">
                <!-- CSV Import 파일 입력 -->
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                
                <!-- Import CSV 버튼 -->
                <button onclick="document.getElementById('csvFileInput').click()" title="CSV에서 테이블 생성">
                    📁 Import CSV
                </button>
                
                <button onclick="saveTable()" class="primary">💾 Create</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('columns')">Columns</div>
            <div class="tab" onclick="switchTab('data')">Data</div>
        </div>

        <!-- Columns Tab -->
        <div id="columnsTab" class="tab-content active">
            <div class="content-wrapper">
                <div class="content-toolbar">
                    <h2>Table Columns</h2>
                    <button onclick="addColumn()" class="secondary">+ Add Column</button>
                </div>

                <div class="columns-list-container">
                    <div class="columns-header">
                        <div></div>
                        <div>PK</div>
                        <div>Column Name</div>
                        <div>Preset</div>
                        <div>Nullable</div>
                        <div>Unique</div>
                        <div>Type Definition</div>
                        <div>Actions</div>
                    </div>
                    <div id="columnsBody"></div>
                </div>
            </div>
        </div>

        <!-- Data Tab -->
        <div id="dataTab" class="tab-content">
            <div class="content-wrapper">
                <div class="content-toolbar">
                    <h2>Table Data</h2>
                    <div class="toolbar-actions">
                        <span id="rowCount" style="color: #666; font-size: 12px;">0 rows</span>
                        <button onclick="openImportDataModal()" class="secondary">📥 Import Data</button>
                        <button onclick="addRow()" class="secondary">+ Add Row</button>
                        <button onclick="refreshData()" class="secondary">🔄 Refresh</button>
                    </div>
                </div>

                <div class="filter-bar">
                    <input type="text" 
                           id="searchInput" 
                           placeholder="Search across all columns..." 
                           oninput="filterData()">
                    <select id="filterColumn" onchange="filterData()">
                        <option value="">All columns</option>
                    </select>
                </div>

                <div class="data-grid-container" id="dataGridContainer">
                    <!-- Data grid will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // MySQL Presets Configuration
        // MySQL Presets Configuration
        const PRESETS = {
            uuid: {
                name: 'UUID',
                icon: '🆔',
                description: 'Universally Unique Identifier (CHAR(36) with UUID() default)',
                defaults: {
                    type: 'CHAR',
                    length: '36',
                    nullable: false,
                    unique: true,
                    default_mode: 'sql_expression',
                    default_value: 'UUID()',
                    comment: ''
                },
                fields: [
                    'comment'
                ]

        function renderColumns() {
            const container = document.getElementById('columnsBody');
            container.innerHTML = columns.map((col, idx) => {
                const preset = PRESETS[col.preset] || PRESETS.custom;
                const isExpanded = expandedColumns.has(idx);
                const isEditing = editingColumn === idx;
                
                // 편집 모드에서는 편집 중인 row만 활성화, 신규 모드는 모두 활성화
                const isDisabled = isEditMode && !isEditing;
                
                return `
                    <div class="column-row-wrapper">
                        <div class="column-row ${isEditing ? 'editing' : ''}" onclick="${isDisabled ? '' : `toggleExpand(${idx})`}">

                                        onchange="changePreset(${idx}, this.value)"

                                        </option>

                                </select>
                            </div>
                            <div class="col-pk">
                                <input type="checkbox" 
                                       ${col.nullable ? 'checked' : ''}
                                       ${col.is_pk || isDisabled ? 'disabled' : ''}
                                       onclick="event.stopPropagation(); updateColumn(${idx}, 'nullable', this.checked)">
                            </div>
                            <div class="col-pk">
                                <input type="checkbox" 
                                       ${col.unique ? 'checked' : ''}
                                       ${isDisabled ? 'disabled' : ''}
                                       onclick="event.stopPropagation(); updateColumn(${idx}, 'unique', this.checked)">
                            </div>
                            <div class="col-type">${getTypeDefinition(col)}</div>
                            <div class="col-actions">
                                ${isEditMode ? `
                                    ${isEditing || col._isNew ? `
                                        <button class="primary" onclick="event.stopPropagation(); saveColumnEdit(${idx})">
                                            Save
                                        </button>
                                        <button onclick="event.stopPropagation(); cancelColumnEdit(${idx})">
                                            Cancel
                                        </button>
                                    ` : `
                                        <button onclick="event.stopPropagation(); editColumn(${idx})">
                                            Edit
                                        </button>
                                        <button class="danger" onclick="event.stopPropagation(); deleteColumn(${idx})">
                                            Delete
                                        </button>
                                    `}
                                ` : `
                                    <button class="danger" onclick="event.stopPropagation(); deleteColumn(${idx})">
                                        Delete
                                    </button>
                                `}
                            </div>
                        </div>
                        ${isExpanded && !isDisabled ? renderDetailPanel(col, idx, preset) : ''}
                    </div>
                `;
            }).join('');

        function getTypeDefinition(col) {
            let def = col.type;
            
            if (col.length && ['VARCHAR', 'CHAR', 'TINYINT', 'SMALLINT', 'INT', 'BIGINT'].includes(col.type)) {
                def += `(${col.length})`;
            } else if (col.type === 'DECIMAL' && col.decimal_places) {
                const precision = col.precision || (10 + parseInt(col.decimal_places));
                def += `(${precision},${col.decimal_places})`;
            }
            
            if (col.unsigned) def += ' UNSIGNED';
            if (col.auto_increment) def += ' AUTO_INCREMENT';
            if (col.on_update_timestamp) def += ' ON UPDATE CURRENT_TIMESTAMP';
            
            return def;
        }

        function renderDetailPanel(col, idx, preset) {
            let html = '<div class="column-detail">';
            
            html += `
                <div style="grid-column: 1 / -1; margin-bottom: 8px;">
                    <span class="preset-badge ${col.preset === 'custom' ? 'custom' : ''}">
                        ${preset.icon} ${preset.name}
                    </span>
                    <span style="margin-left: 8px; font-size: 12px; color: #666;">${preset.description}</span>
                </div>
            `;

            preset.fields.forEach(field => {
                if (typeof field === 'string') {
                    html += renderStandardField(field, col, idx);
                } else if (field.type === 'conditional') {
                    if (field.condition(col)) {
                        if (typeof field.field === 'string') {
                            html += renderStandardField(field.field, col, idx);
                        } else {
                            html += renderField(field.field, col, idx);
                        }
                    }
                } else if (field.type === 'fk_selector') {
                    html += renderFKSelector(col, idx);
                } else {
                    html += renderField(field, col, idx);
                }
            });

            html += '</div>';
            return html;
        }

            } else if (fieldName === 'unique') {
                return `
                    <div class="detail-field">
                        <div class="checkbox-field">
                            <input type="checkbox" id="unique_${idx}" 
                                   ${col.unique ? 'checked' : ''}
                                   onchange="updateColumn(${idx}, 'unique', this.checked)">
                            <label for="unique_${idx}">Unique</label>
                        </div>
                    </div>
                `;
            } else if (fieldName === 'default_mode') {
                return `
                    <div class="detail-field">
                        <label class="detail-label">Default</label>
                        <select onchange="updateColumn(${idx}, 'default_mode', this.value)">
                            <option value="no_default" ${(col.default_mode || 'no_default') === 'no_default' ? 'selected' : ''}>No Default</option>
                            <option value="default_value" ${col.default_mode === 'default_value' ? 'selected' : ''}>Default Value</option>
                            <option value="sql_expression" ${col.default_mode === 'sql_expression' ? 'selected' : ''}>SQL Expression</option>
                        </select>
                    </div>
                `;
            } else if (fieldName === 'default_value') {
                const isDisabled = (col.default_mode || 'no_default') === 'no_default';
                const placeholder = col.default_mode === 'sql_expression' 
                    ? 'e.g., CURRENT_TIMESTAMP, UUID()' 
                    : getDefaultValuePlaceholder(col);
                return `
                    <div class="detail-field">
                        <label class="detail-label">
                            ${col.default_mode === 'sql_expression' ? 'SQL Expression' : 'Default Value'}
                        </label>
                        <input type="text" value="${col.default_value || ''}" 
                               onchange="updateColumn(${idx}, 'default_value', this.value)"
                               placeholder="${placeholder}"
                               ${isDisabled ? 'disabled' : ''}>
                    </div>
                `;
            } else if (fieldName === 'comment') {
                return `
                    <div class="detail-field" style="grid-column: 1 / -1;">
                        <label class="detail-label">Comment</label>
                        <textarea 
                            placeholder="Add column description or notes..."
                            onchange="updateColumn(${idx}, 'comment', this.value)">${col.comment || ''}</textarea>
                    </div>
                `;
            }
            return '';
        }

        function getDefaultValuePlaceholder(col) {
            if (col.preset === 'number') return 'e.g., 0';
            if (col.preset === 'json') return 'e.g., {}';
            if (col.preset === 'text') return 'e.g., hello';
            return 'Enter default value';
        }

        function renderField(field, col, idx) {
            if (field.type === 'select') {
                return `
                    <div class="detail-field">
                        <label class="detail-label">
                            ${field.label}
                            ${field.help ? `<span class="help-icon" title="${field.help}">?</span>` : ''}
                        </label>
                        <select onchange="updateColumn(${idx}, '${field.name}', this.value)">
                            ${field.options.map(opt => `
                                <option value="${opt.value}" ${col[field.name] === opt.value ? 'selected' : ''}>
                                    ${opt.label}
                                </option>
                            `).join('')}
                        </select>
                        ${field.help ? `<div class="help-text">${field.help}</div>` : ''}
                    </div>
                `;
            } else if (field.type === 'boolean') {
                return `
                    <div class="detail-field">
                        <div class="checkbox-field">
                            <input type="checkbox" id="${field.name}_${idx}" 
                                   ${col[field.name] ? 'checked' : ''}
                                   onchange="updateColumn(${idx}, '${field.name}', this.checked)">
                            <label for="${field.name}_${idx}">${field.label}</label>
                        </div>
                        ${field.help ? `<div class="help-text">${field.help}</div>` : ''}
                    </div>
                `;
            } else if (field.type === 'text' || field.type === 'number') {
                return `
                    <div class="detail-field">
                        <label class="detail-label">${field.label}</label>
                        <input type="${field.type}" value="${col[field.name] || ''}"
                               ${field.placeholder ? `placeholder="${field.placeholder}"` : ''}
                               onchange="updateColumn(${idx}, '${field.name}', this.value)">
                        ${field.help ? `<div class="help-text">${field.help}</div>` : ''}
                    </div>
                `;
            }
            return '';
        }

        function renderFKSelector(col, idx) {
            const selectedTable = availableTables.find(t => t.name === col.fk_table);
            const columns = selectedTable ? selectedTable.columns : [];
            
            return `
                <div class="detail-field" style="grid-column: 1 / -1;">
                    <label class="detail-label">Foreign Key Configuration</label>
                    <div class="fk-selector">
                        <select onchange="updateColumn(${idx}, 'fk_table', this.value)">
                            <option value="">Select table...</option>
                            ${availableTables.map(table => `
                                <option value="${table.name}" ${col.fk_table === table.name ? 'selected' : ''}>
                                    ${table.name}
                                </option>
                            `).join('')}
                        </select>
                        
                        <select ${!col.fk_table ? 'disabled' : ''} 
                                onchange="updateColumn(${idx}, 'fk_column', this.value)">
                            <option value="">Select column...</option>
                            ${columns.map(column => `
                                <option value="${column.name}" 
                                        ${col.fk_column === column.name ? 'selected' : ''}
                                        ${!column.isUnique ? 'disabled' : ''}>
                                    ${column.name} (${column.type}) ${!column.isUnique ? '- Not unique' : ''}
                                </option>
                            `).join('')}
                        </select>
                        
                        <div class="fk-actions">
                            <div class="detail-field" style="margin: 0;">
                                <label class="detail-label">On Delete</label>
                                <select onchange="updateColumn(${idx}, 'on_delete', this.value)">
                                    <option value="NO ACTION" ${col.on_delete === 'NO ACTION' ? 'selected' : ''}>No Action</option>
                                    <option value="RESTRICT" ${col.on_delete === 'RESTRICT' ? 'selected' : ''}>Restrict</option>
                                    <option value="CASCADE" ${col.on_delete === 'CASCADE' ? 'selected' : ''}>Cascade</option>
                                    <option value="SET NULL" ${col.on_delete === 'SET NULL' ? 'selected' : ''}>Set Null</option>
                                </select>
                            </div>
                            <div class="detail-field" style="margin: 0;">
                                <label class="detail-label">On Update</label>
                                <select onchange="updateColumn(${idx}, 'on_update', this.value)">
                                    <option value="NO ACTION" ${col.on_update === 'NO ACTION' ? 'selected' : ''}>No Action</option>
                                    <option value="RESTRICT" ${col.on_update === 'RESTRICT' ? 'selected' : ''}>Restrict</option>
                                    <option value="CASCADE" ${col.on_update === 'CASCADE' ? 'selected' : ''}>Cascade</option>
                                    <option value="SET NULL" ${col.on_update === 'SET NULL' ? 'selected' : ''}>Set Null</option>
                                </select>
